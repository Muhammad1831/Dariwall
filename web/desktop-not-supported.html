<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <title>DariWall</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background-color: #f9f9f9;
    }
    .centered {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      color: #333;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="centered">
    <h1>این برنامه فقط روی موبایل کار می‌کند</h1>
    <p>برای استفاده از نسخه وب داریوال، لطفاً سایت را با موبایل باز کنید.</p>
  </div>
</body>
</html>
